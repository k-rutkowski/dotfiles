orientation: normal
rows: 3
columns: 4
knobs: 3

layers:
  - buttons:
      - ["escape", "q", "w", "e"]
      - ["shift", "a", "s", "d"]
      - ["ctrl", "x", "c", "v"]
    knobs:
      - ccw: "wheelup"
        press: "space"
        cw: "wheeldown"
      - ccw: "prev"
        press: "play"
        cw: "next"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["numlock", "numpad7", "numpad8", "numpad9"]
      - ["numpaddot", "numpad4", "numpad5", "numpad6"]
      - ["numpad0", "numpad1", "numpad2", "numpad3"]
    knobs:
      - ccw: "left"
        press: "enter"
        cw: "right"
      - ccw: "up"
        press: "enter"
        cw: "down"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["ctrl-shift-alt-win-a", "ctrl-shift-alt-win-b", "ctrl-shift-alt-win-c", "ctrl-shift-alt-win-d"]
      - ["ctrl-shift-alt-win-e", "ctrl-shift-alt-win-f", "ctrl-shift-alt-win-g", "ctrl-shift-alt-win-h"]
      - ["ctrl-shift-alt-win-i", "ctrl-shift-alt-win-j", "ctrl-shift-alt-win-k", "ctrl-shift-alt-win-l"]
    knobs:
      - ccw: "left"
        press: "enter"
        cw: "right"
      - ccw: "up"
        press: "enter"
        cw: "down"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
