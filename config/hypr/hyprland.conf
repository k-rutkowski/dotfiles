windowrule = opacity 0.80 0.70, float on, center on, size 800 600, match:class ^(blueman-manager)$
windowrule = opacity 0.80 0.70, float on, match:class ^(nm-applet)$
windowrule = opacity 0.80 0.70, match:class ^(Spotify)$
windowrule = opacity 0.80 0.70, match:initial_title ^(Spotify Free)$
