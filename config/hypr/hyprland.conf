# windowrulev2 = monitor:$priMonitor,class:^(Dunst)$
windowrule = float on, center on, size 360 480, match:title ^(Calculator)$

windowrule = suppress_event maximize, match:class .* # You'll probably like this.

# my custom rules
windowrule = workspace 3, match:class ^(firefox)$
windowrule = workspace 4, no_initial_focus on, immediate on, match:class ^(jetbrains-rider)$
windowrule = workspace 5, match:class ^UnrealEditor(.*)$
windowrule = workspace 6, match:class ^(epic_asset_manager)$
windowrule = workspace 10, match:class ^(org.mozilla.Thunderbird)$
windowrule = workspace 10, match:class ^(Slack)$

